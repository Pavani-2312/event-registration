<!DOCTYPE html>
<html>
<head>
    <title>Event Registration Page</title>
</head>
<body>
    <div>
        <h1>
            Event Registration
        </h1>
        <p>Register for events</p>
        <form id = "registrationForm">
            <label>Name</label>            
            <input type="text" id="name" placeholder="Enter full name" required><br><br>
            <label>Phone</label>
            <input type="text" id="phone" placeholder="Enter phone number" required><br><br>
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter Email"><br><br>
            <label>Select events</label>
            <select id="event">
                <option>Gen AI</option>
                <option>Cyber security</option>
                <option>Agentic AI</option>
                <option>IOT</option>
            </select>
            <br><br>
            <label>Date of Event</label>
            <input type="date" id="date" required><br><br>
            <button type="submit">Register</button>
        </form>
        <div id="details"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
